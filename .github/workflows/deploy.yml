name: CDK Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '24'

# Required secrets:
#   AWS_DEPLOY_ROLE_ARN  — IAM role ARN configured with GitHub OIDC trust
#   EMAIL_SOURCE         — SES-verified sender address
#   DESTINATION_EMAIL    — destination email address
#
# One-time AWS setup (run once per account/region):
#   npx cdk bootstrap aws://<ACCOUNT_ID>/us-east-1

jobs:
  diff:
    name: CDK Diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Diff
        id: diff
        run: npx cdk diff 2>&1 | tee cdk-diff.txt
        env:
          EMAIL_SOURCE: ${{ secrets.EMAIL_SOURCE }}
          DESTINATION_EMAIL: ${{ secrets.DESTINATION_EMAIL }}

      - name: Comment diff on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('cdk-diff.txt', 'utf8');
            const body = `## CDK Diff\n\`\`\`\n${diff.slice(0, 60000)}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  deploy:
    name: CDK Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Deploy
        run: npx cdk deploy --require-approval never
        env:
          EMAIL_SOURCE: ${{ secrets.EMAIL_SOURCE }}
          DESTINATION_EMAIL: ${{ secrets.DESTINATION_EMAIL }}
